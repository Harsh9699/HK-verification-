<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - HK Workshop</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #fff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #1e293b;
      --primary-hover: #0f172a;
      --border: #e2e8f0;
    }
    body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .panel { background: var(--card-bg); width: 100%; max-width: 400px; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.04); border: 1px solid var(--border); box-sizing: border-box; }
    h1 { margin: 0 0 8px 0; font-size: 24px; font-weight: 700; text-align: center; }
    .sub { text-align: center; color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text-main); font-family: inherit; font-size: 15px; box-sizing: border-box; margin-bottom: 20px; outline: none; transition: all 0.2s; }
    input:focus { border-color: var(--text-muted); box-shadow: 0 0 0 4px rgba(100,116,139,0.1); background: #fff; }
    button { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.2s; }
    button:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .msg { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; display: none; }
    .msg.err { background: #fee2e2; color: #991b1b; display: block; }
    .msg.ok { background: #dcfce7; color: #166534; display: block; }
  </style>
</head>
<body>

<div class="panel">
  <h1>Set New Password</h1>
  <div class="sub">Enter your new password below</div>
  
  <label>New Password</label>
  <input type="password" id="newPassword" placeholder="Minimum 6 characters">
  <button id="resetBtn" type="button">Update Password</button>
  
  <div class="msg" id="msgBox"></div>
  <div style="text-align:center; margin-top:20px;">
    <a href="student.html" style="font-size:14px; color:var(--text-muted); text-decoration:none;">&larr; Back to Login</a>
  </div>
</div>

<script>
(function(){
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var accessToken = params.get('access_token');
  var type = params.get('type');
  var msgBox = document.getElementById('msgBox');

  if(type !== 'recovery' || !accessToken) {
    msgBox.className = "msg err";
    msgBox.textContent = "Invalid or expired recovery link.";
    document.getElementById('resetBtn').disabled = true;
    return;
  }

  var SUPABASE_URL = "https://hdjfodduhlmrmphaxsjj.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_YnubDZntig72f8Ge_7mQwQ_gVS-tZzq";

  document.getElementById('resetBtn').addEventListener('click', function(){
    var newPassword = document.getElementById('newPassword').value;
    if(newPassword.length < 6) {
      msgBox.className = "msg err";
      msgBox.textContent = "Password must be at least 6 characters.";
      return;
    }

    msgBox.className = "msg";
    msgBox.style.display = "block";
    msgBox.textContent = "Updating password...";

    fetch(SUPABASE_URL + "/auth/v1/user", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + accessToken
      },
      body: JSON.stringify({ password: newPassword })
    })
    .then(function(res){
      if(res.ok) {
        msgBox.className = "msg ok";
        msgBox.textContent = "Password updated successfully! You can now log in.";
        document.getElementById('newPassword').value = '';
      } else {
        return res.json().then(function(data){
          msgBox.className = "msg err";
          msgBox.textContent = "Failed to update: " + (data.msg || data.error_description || "Unknown error");
        });
      }
    })
    .catch(function(err){
      msgBox.className = "msg err";
      msgBox.textContent = "Network error: " + err.message;
    });
  });
})();
</script>
</body>
</html>
